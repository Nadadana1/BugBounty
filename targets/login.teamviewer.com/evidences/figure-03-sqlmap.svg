<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="900" height="510" fill="#f7f8fa"/><rect x="22" y="22" width="856" height="463" rx="10" fill="#fff" stroke="#d7dce2"/><rect x="22" y="22" width="856" height="58" rx="10" fill="#f2f4f7"/><text x="44" y="59" font-family="Arial,sans-serif" font-size="22" fill="#172b4d" font-weight="bold">Figure 3 — SQLmap et limitations des réponses</text><text x="45" y="113" font-family="Arial,sans-serif" font-size="15" fill="#526477">Analyse des essais documentés sur l'endpoint d'authentification</text><rect x="44" y="227" width="812" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="58" y="160" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Paramètre étudié : UserName</text><text x="58" y="190" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Essai 1 : réponses 403 / 429 observées</text><text x="58" y="220" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Essai 2 : 142 x HTTP 403 ; 9 x HTTP 429</text><text x="58" y="250" fill="#7f1d1d" font-size="18" font-family="Menlo,Consolas,monospace">Résultat : aucune injection SQL confirmée</text><text x="58" y="280" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Le serveur a limité ou refusé des requêtes</text><text x="58" y="310" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Les réponses ne permettent pas de conclure</text><text x="58" y="340" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">à l'absence définitive de vulnérabilité</text><line x1="45" y1="420" x2="855" y2="420" stroke="#d7dce2"/><text x="45" y="447" font-family="Arial,sans-serif" font-size="15" fill="#334155">Conclusion : test non concluant quant à l'absence de SQLi.</text><text x="45" y="471" font-family="Arial,sans-serif" font-size="12" fill="#92400e">RECONSTITUTION À PARTIR DES SORTIES FOURNIES — PAS UNE CAPTURE ORIGINALE</text></svg>