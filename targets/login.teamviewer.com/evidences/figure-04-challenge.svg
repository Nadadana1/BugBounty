<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="900" height="510" fill="#f7f8fa"/><rect x="22" y="22" width="856" height="463" rx="10" fill="#fff" stroke="#d7dce2"/><rect x="22" y="22" width="856" height="58" rx="10" fill="#f2f4f7"/><text x="44" y="59" font-family="Arial,sans-serif" font-size="22" fill="#172b4d" font-weight="bold">Figure 4 — Réponse de protection anti-bot</text><text x="45" y="113" font-family="Arial,sans-serif" font-size="15" fill="#526477">Observation dans Burp Suite · Requête de vérification XSS</text><rect x="44" y="227" width="812" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="58" y="160" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Réponse observée : HTTP/2 403 Forbidden</text><text x="58" y="190" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Content-Type : text/html</text><text x="58" y="220" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">X-Anx-Pow : true</text><text x="58" y="250" fill="#7f1d1d" font-size="18" font-family="Menlo,Consolas,monospace">Protection : challenge Anubis (PoW)</text><text x="58" y="280" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">Marqueur XSS recherché : 0 occurrence</text><text x="58" y="310" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">La réponse ne provient pas du traitement</text><text x="58" y="340" fill="#243247" font-size="18" font-family="Menlo,Consolas,monospace">normal de l'application d'authentification</text><line x1="45" y1="420" x2="855" y2="420" stroke="#d7dce2"/><text x="45" y="447" font-family="Arial,sans-serif" font-size="15" fill="#334155">Conclusion : test XSS non concluant, challenge actif.</text><text x="45" y="471" font-family="Arial,sans-serif" font-size="12" fill="#92400e">RECONSTITUTION À PARTIR DES SORTIES FOURNIES — PAS UNE CAPTURE ORIGINALE</text></svg>